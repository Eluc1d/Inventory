root = "."
tmp_dir = "tmp"

[build]
  # -buildvcs=false: skip Go's own automatic VCS stamping. The bind-mounted
  # .git (see docker-compose.yml) is only there for version.go's own
  # `git describe` call; Go's built-in stamping runs `git status` too, which
  # can fail (exit 128) on hosts where the mounted .git's owning UID doesn't
  # match the container user ("dubious ownership"), aborting the build.
  cmd = "go build -buildvcs=false -o ./techtoss ."
  bin = "./techtoss"
  include_ext = ["go", "html", "tpl", "tmpl"]
  exclude_ext = ["sql", "sqlite", "db"]
  poll = true
  delay = 1000
  send_interrupt = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
