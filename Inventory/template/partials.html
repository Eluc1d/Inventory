{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · TechToss</title>
<link rel="stylesheet" href="/static/techtoss.css">
</head>
<body data-editable="{{if .Editable}}1{{end}}">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/static/logo.png" alt="TechToss"></a>
    <nav class="nav">
      <a href="/"          class="{{if eq .Active "machines"}}active{{end}}">Machines</a>
      <a href="/inventory" class="{{if eq .Active "inventory"}}active{{end}}">Parts</a>
      <a href="/search"    class="{{if eq .Active "search"}}active{{end}}">Search</a>
    </nav>
    <div class="topbar-search">
      <input id="topbarSearch" type="search" autocomplete="off"
             placeholder="Type to search..." aria-label="Topbar search">
      <div id="topbarSearchOptions" class="dropdown-options hidden"></div>
    </div>
    <div class="hotkey-help">
      <button type="button" id="hotkeyHelpButton" class="hotkey-help-btn"
              aria-label="Keyboard shortcuts" aria-expanded="false" title="Keyboard shortcuts (?)">?</button>
      <div id="hotkeyHelpPanel" class="hotkey-help-panel hidden" role="dialog" aria-label="Keyboard shortcuts">
        <div class="hotkey-help-heading">Keyboard shortcuts</div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>1</kbd></span><span class="hotkey-desc">Go to Machines</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>2</kbd></span><span class="hotkey-desc">Go to Parts inventory</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>3</kbd></span><span class="hotkey-desc">Go to Search</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>/</kbd></span><span class="hotkey-desc">Focus the search box</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>Shift</kbd>+<kbd>=</kbd></span><span class="hotkey-desc">Create a new machine</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>?</kbd></span><span class="hotkey-desc">Toggle this panel</span></div>
        <div class="hotkey-row"><span class="hotkey-keys"><kbd>Esc</kbd></span><span class="hotkey-desc">Close this panel, or unfocus search</span></div>
      </div>
    </div>
  </div>
</header>
<main>
{{end}}

{{define "foot"}}
</main>
<script>
// Keyboard shortcuts — delegated on document so they work on every page,
// regardless of which search box (if any) is present. The "?" button next to
// the topbar search lists these for discoverability; keep that list in sync
// with the branches below when adding new ones.
(function () {
  var helpButton = document.getElementById('hotkeyHelpButton');
  var helpPanel = document.getElementById('hotkeyHelpPanel');

  function openHelp() {
    if (!helpPanel) return;
    helpPanel.classList.remove('hidden');
    if (helpButton) helpButton.setAttribute('aria-expanded', 'true');
  }
  function closeHelp() {
    if (!helpPanel) return;
    helpPanel.classList.add('hidden');
    if (helpButton) helpButton.setAttribute('aria-expanded', 'false');
  }
  function toggleHelp() {
    if (!helpPanel) return;
    if (helpPanel.classList.contains('hidden')) openHelp(); else closeHelp();
  }

  if (helpButton) {
    helpButton.addEventListener('click', function (event) {
      event.stopPropagation();
      toggleHelp();
    });
  }
  document.addEventListener('click', function (event) {
    if (helpPanel && !helpPanel.classList.contains('hidden') && !event.target.closest('.hotkey-help')) {
      closeHelp();
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    var target = event.target;
    var tag = (target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;

    // 1/2/3 jump between the app's three top-level pages.
    var navTargets = { '1': '/', '2': '/inventory', '3': '/search' };
    if (navTargets.hasOwnProperty(event.key) && !typing) {
      event.preventDefault();
      var dest = navTargets[event.key];
      if (window.location.pathname !== dest) {
        window.location.href = dest;
      }
      return;
    }

    // "/" jumps to search: the page's own search box on the Search page,
    // otherwise the topbar search present on every page.
    if (event.key === '/' && !typing) {
      var box = document.getElementById('searchInput') || document.getElementById('topbarSearch');
      if (box) {
        event.preventDefault();
        box.focus();
        box.select();
      }
      return;
    }

    // "?" toggles the shortcuts help panel.
    if (event.key === '?' && !typing) {
      event.preventDefault();
      toggleHelp();
      return;
    }

    // Shift+= ("+") creates a new machine — same destination as the
    // "+ Log machine" button, which is only ever rendered when editable.
    if (event.shiftKey && event.key === '+' && !typing) {
      if (document.body.dataset.editable === '1') {
        event.preventDefault();
        window.location.href = '/machine/edit?id=new';
      }
      return;
    }

    // Escape closes the help panel if it's open, else unfocuses an active
    // search box (mirrors the click-outside-closes behavior elsewhere).
    if (event.key === 'Escape') {
      if (helpPanel && !helpPanel.classList.contains('hidden')) {
        closeHelp();
        return;
      }
      var active = document.activeElement;
      if (active && (active.id === 'searchInput' || active.id === 'topbarSearch')) {
        active.blur();
      }
    }
  });
})();

// Live search-as-you-type. Runs only if the search input is present.
(function () {
  var input = document.getElementById('searchInput');
  if (!input) return;
  var box = document.getElementById('liveResults');
  var header = document.getElementById('liveHeader');
  var scopeSelect = document.getElementById('searchScope');
  var timer = null;
  var last = { query: '', rows: [], recent: false };
  var sortKey = null;
  var sortDir = 'asc';

  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // Sorting happens entirely client-side, over whatever rows the last fetch
  // returned — no need to re-hit the server just to reorder what's already
  // on screen.
  function sortedRows() {
    if (!sortKey) return last.rows;
    var rows = last.rows.slice();
    rows.sort(function (a, b) {
      var av = (a[sortKey] || '').toLowerCase();
      var bv = (b[sortKey] || '').toLowerCase();
      var cmp = av < bv ? -1 : (av > bv ? 1 : 0);
      return sortDir === 'desc' ? -cmp : cmp;
    });
    return rows;
  }

  function renderHeader() {
    if (!header) return;
    if (!last.rows.length) { header.classList.add('hidden'); return; }
    header.classList.remove('hidden');
    header.querySelectorAll('.sort-th').forEach(function (btn) {
      var arrow = btn.querySelector('.sort-arrow');
      if (arrow) arrow.remove();
      if (btn.getAttribute('data-sort') === sortKey) {
        btn.insertAdjacentHTML('beforeend',
          '<span class="sort-arrow">' + (sortDir === 'asc' ? '&uarr;' : '&darr;') + '</span>');
      }
    });
  }

  function renderRows() {
    var rows = sortedRows();
    if (!rows.length) {
      var msg = last.query
        ? 'No machines or parts match &ldquo;' + esc(last.query) + '&rdquo;.'
        : 'Nothing tracked yet.';
      box.innerHTML = '<div class="live-empty">' + msg + '</div>';
      box.classList.remove('hidden');
    } else {
      var heading = (!last.query && last.recent) ? '<div class="live-heading">Recently added</div>' : '';
      box.innerHTML = heading + rows.map(function (r) {
        return '<a class="live-row" href="' + r.href + '">' + row(r) + '</a>';
      }).join('');
      box.classList.remove('hidden');
    }
    renderHeader();
  }

  function row(r){
    return '<span class="kind ' + r.kind + '">' + r.kind + '</span>' +
      '<span class="lr-title cell-truncate" title="' + esc(r.title || '(untitled)') + '">' + esc(r.title || '(untitled)') + '</span>' +
      '<span class="lr-sub">' + esc(r.subtitle) + '</span>' +
      (r.location ? '<span class="lr-loc" title="' + esc(r.location) + '">' + esc(r.location) + '</span>' : '') +
      (r.badge ? '<span class="lr-badge">' + esc(r.badge) + '</span>' : '');
  }

  function render(data) {
    last = data;
    renderRows();
  }

  function run() {
    var q = input.value.trim();
    var scope = scopeSelect ? scopeSelect.value : '';
    fetch('/api/live?q=' + encodeURIComponent(q) + '&scope=' + encodeURIComponent(scope))
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {});
  }
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(run, 120);
  });
  if (scopeSelect) {
    scopeSelect.addEventListener('change', run);
  }

  if (header) {
    header.querySelectorAll('.sort-th').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-sort');
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'asc';
        }
        renderRows();
      });
    });
  }

  // Always show something on load: recently-added items when idle, or
  // matching results if the page loaded with a ?q= already filled in.
  run();
})();

(function () {
  var input = document.getElementById('topbarSearch');
  if (!input) return;
  var box = document.getElementById('topbarSearchOptions');
  var timer = null;

  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(data) {
    if (!data.rows.length) {
      var msg = data.query ? 'No results for &ldquo;' + esc(data.query) + '&rdquo;.' : 'Nothing tracked yet.';
      box.innerHTML = '<div class="live-empty">' + msg + '</div>';
      box.classList.remove('hidden');
      return;
    }
    var heading = (!data.query && data.recent) ? '<div class="live-heading">Recently added</div>' : '';
    box.innerHTML = heading + data.rows.map(function (r) {
      return '<button type="button" class="dropdown-option" data-href="' + r.href + '">' +
        '<span class="kind ' + r.kind + '">' + esc(r.kind) + '</span>' +
        '<span class="lr-title" title="' + esc(r.title || '(untitled)') + '">' + esc(r.title || '(untitled)') + '</span>' +
        '<span class="lr-sub">' + esc(r.subtitle) + '</span>' +
        (r.location ? '<span class="lr-loc" title="' + esc(r.location) + '">' + esc(r.location) + '</span>' : '') +
        (r.badge ? '<span class="lr-badge">' + esc(r.badge) + '</span>' : '') +
      '</button>';
    }).join('');
    box.classList.remove('hidden');
  }

  function run() {
    var q = input.value.trim();
    fetch('/api/live?q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {});
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(run, 120);
  });
  input.addEventListener('focus', run);

  box.addEventListener('click', function (event) {
    var button = event.target.closest('.dropdown-option');
    if (!button) return;
    window.location = button.dataset.href;
  });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.topbar-search')) {
      box.classList.add('hidden');
    }
  });
})();

// Notes-bubble toggle and truncated-text row expansion — delegated so it
// works on any page containing these classes, no per-page script needed.
document.addEventListener('click', function (event) {
  var toggle = event.target.closest('.notes-toggle');
  if (toggle) {
    event.preventDefault();
    event.stopPropagation();
    var targetId = toggle.getAttribute('data-notes-target');
    var target = targetId && document.getElementById(targetId);
    if (target) target.classList.toggle('hidden');
    return;
  }
  var row = event.target.closest('.expandable-row');
  if (row && !event.target.closest('a, button, form, input, select, textarea, summary')) {
    row.classList.toggle('expanded');
  }
});
</script>
</body>
</html>
{{end}}
